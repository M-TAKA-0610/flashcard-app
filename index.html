<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="情報系の学生向け、情報技術用語を学習する単語帳アプリ">
  <title>IT用語 単語帳</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1 class="title">IT用語 単語帳</h1>
    <p class="subtitle">カードをクリック（タップ）すると説明が表示されます</p>
  </header>

  <main class="main">
    <div class="progress" aria-hidden="true">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <p class="counter" id="counter" aria-live="polite">1 / 20</p>

    <div class="card-area">
      <button type="button" class="card" id="card" aria-label="カード。クリックで表と裏を切り替え">
        <span class="card-inner">
          <span class="card-face card-front">
            <span class="card-label">用語</span>
            <span class="card-term" id="cardTerm"></span>
            <span class="card-reading" id="cardReading"></span>
            <span class="card-hint">クリックで説明を見る</span>
          </span>
          <span class="card-face card-back">
            <span class="card-label">説明</span>
            <span class="card-back-term" id="cardBackTerm"></span>
            <span class="card-desc" id="cardDesc"></span>
            <span class="card-hint">クリックで用語に戻る</span>
          </span>
        </span>
      </button>
    </div>

    <nav class="controls" aria-label="カード操作">
      <button type="button" class="btn" id="prevBtn">
        <span aria-hidden="true">&#9664;</span> 前へ
      </button>
      <button type="button" class="btn btn-sub" id="shuffleBtn">シャッフル</button>
      <button type="button" class="btn" id="nextBtn">
        次へ <span aria-hidden="true">&#9654;</span>
      </button>
    </nav>

    <p class="help">
      <span class="help-pc">キーボード: ← → で移動、Space / Enter で裏返し</span>
      <span class="help-sp">左右にスワイプしても移動できます</span>
    </p>
  </main>

  <footer class="footer">
    <small>IT用語 単語帳</small>
  </footer>

  <script src="script.js"></script>
</body>
</html>
