<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="情報系の学生向け、情報技術用語を学習する単語帳アプリ">
  <meta name="theme-color" content="#0a0e1f">
  <title>IT用語 単語帳</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg" aria-hidden="true">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
    <span class="grid"></span>
  </div>

  <div class="app">
    <header class="header">
      <p class="eyebrow">&lt;/&gt; TECH VOCABULARY</p>
      <h1 class="title">IT用語 <span class="title-accent">単語帳</span></h1>
    </header>

    <main class="main">
      <div class="status">
        <span class="counter" id="counter" aria-live="polite">
          <span class="counter-now" id="counterNow">01</span>
          <span class="counter-sep">/</span>
          <span class="counter-total" id="counterTotal">20</span>
        </span>
        <div class="progress" aria-hidden="true">
          <div class="progress-bar" id="progressBar"></div>
        </div>
      </div>

      <div class="card-area" id="cardArea">
        <button type="button" class="card" id="card" aria-label="カード。クリックで表と裏を切り替え">
          <span class="card-inner">
            <span class="card-face card-front">
              <span class="card-top">
                <span class="chip" id="cardCategory"></span>
                <span class="card-no" id="cardNo"></span>
              </span>
              <span class="card-body">
                <span class="card-term" id="cardTerm"></span>
                <span class="card-reading" id="cardReading"></span>
              </span>
              <span class="card-hint">
                <span class="hint-icon" aria-hidden="true">&#8635;</span>
                <span><span class="help-pc">クリック</span><span class="help-sp">タップ</span>で意味を見る</span>
              </span>
            </span>
            <span class="card-face card-back">
              <span class="card-top">
                <span class="chip chip-back">意味</span>
                <span class="card-no" id="cardNoBack"></span>
              </span>
              <span class="card-body card-body-back">
                <span class="card-back-term" id="cardBackTerm"></span>
                <span class="divider" aria-hidden="true"></span>
                <span class="card-desc" id="cardDesc"></span>
              </span>
              <span class="card-hint">
                <span class="hint-icon" aria-hidden="true">&#8635;</span>
                <span><span class="help-pc">クリック</span><span class="help-sp">タップ</span>で用語に戻る</span>
              </span>
            </span>
          </span>
        </button>
      </div>

      <nav class="controls" aria-label="カード操作">
        <button type="button" class="nav-btn" id="prevBtn" aria-label="前のカード">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <button type="button" class="pill-btn" id="flipBtn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 0 1 14-5.3M20 4v5h-5M20 12a8 8 0 0 1-14 5.3M4 20v-5h5"/></svg>
          <span>裏返す</span>
        </button>
        <button type="button" class="pill-btn pill-ghost" id="shuffleBtn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 4h4v4M4 20L20 4M20 16v4h-4M15 15l5 5M4 4l5 5"/></svg>
          <span>シャッフル</span>
        </button>
        <button type="button" class="nav-btn" id="nextBtn" aria-label="次のカード">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        </button>
      </nav>

      <p class="help">
        <span class="help-pc"><kbd>←</kbd><kbd>→</kbd> 移動　<kbd>Space</kbd> 裏返す</span>
        <span class="help-sp">カードを左右にスワイプして移動</span>
      </p>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
